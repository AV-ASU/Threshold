name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-gate:
    name: Full test gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full test gate
        # All six harnesses (smoke + flow + stealth + fold_pursuit +
        # king_roam + render_smoke) -- the same gate run before every
        # commit. Self-configures the SDL dummy drivers.
        timeout-minutes: 25
        run: python tests/run_all.py
      - name: Check canon-doc/code key drift
        # Cheap tripwire: load-bearing item/scene keys named in
        # NARRATIVE.md's Canon invariants must still appear in the
        # source. Pure text/file parsing -- no display/audio needed.
        run: python tools/check_canon_keys.py
